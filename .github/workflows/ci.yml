name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartdispenser
          POSTGRES_PASSWORD: smartdispenser
          POSTGRES_DB: smartdispenser_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartdispenser"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SmartDispenser.sln

      - name: Check formatting
        run: dotnet format SmartDispenser.sln --no-restore --verify-no-changes

      - name: Build
        run: dotnet build SmartDispenser.sln --no-restore -c Release -warnaserror

      - name: Unit tests
        run: dotnet test tests/SmartDispenser.UnitTests --no-build -c Release

      - name: Integration tests (InMemory)
        run: dotnet test tests/SmartDispenser.IntegrationTests --no-build -c Release

      - name: Integration tests (PostgreSQL)
        run: dotnet test tests/SmartDispenser.IntegrationTests --no-build -c Release
        env:
          TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=smartdispenser_ci;Username=smartdispenser;Password=smartdispenser

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack as the README quick start does
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Smoke test
        run: |
          set -a; source .env; set +a
          scripts/smoke.sh http://localhost:8001

      - name: Container logs
        if: always()
        run: docker compose logs api

      - name: Stop
        if: always()
        run: docker compose down -v
