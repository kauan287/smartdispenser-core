services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartdispenser
      POSTGRES_PASSWORD: smartdispenser
      POSTGRES_DB: smartdispenser
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdispenser"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      Database__AutoMigrate: "true"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=smartdispenser;Username=smartdispenser;Password=smartdispenser"
      HealthTechApi__BaseUrl: ${HEALTHTECH_API_URL:-http://host.docker.internal:8000}
      Webhook__Secret: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env (copy .env.example)}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
